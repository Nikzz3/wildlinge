# Checks every pull request must pass before merging. release.yml reuses this workflow on master.
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Typecheck, Vitest (logic, data, map validation, world graph) and the website assembly.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: 1 }
      - run: npm run typecheck
      - run: npm test
      - run: npm run site

  # Playwright scenarios against the browser build: story playthroughs of all chapters + input fuzzing.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: 1 }
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-screenshots, path: out/e2e/, if-no-files-found: ignore }

  # The Linux AppImage boots to the title screen and has the native save bridge.
  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: 1 }
      - run: npm run package -- linux x64
      - run: node scripts/appimage.mjs
      # Allow the unprivileged user namespaces Chromium's sandbox needs (Ubuntu blocks them, Fedora/Bazzite
      # don't), so this runs the AppImage with the sandbox on, like on most desktops. FUSE mounts the AppImage.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 && sudo apt-get install -y fuse3
      - run: xvfb-run -a node scripts/electron-smoke.mjs release/Wildlinge-linux-x64.AppImage
      # Playwright always adds --no-sandbox, so also start the AppImage on its own with the sandbox on:
      # a sandbox failure aborts at once, a healthy app runs until timeout kills it (exit 124).
      - run: |
          unshare -Ur true
          status=0; timeout 15 xvfb-run -a release/Wildlinge-linux-x64.AppImage || status=$?
          test $status -eq 124

  # The macOS DMG holds the signed app next to an Applications link, and the app boots from it.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: 1 }
      - run: npm run package -- darwin arm64
      - run: node scripts/dmg.mjs release/Wildlinge-darwin-arm64 release/Wildlinge-macos-arm64.dmg
      - run: |
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/Wildlinge release/Wildlinge-macos-arm64.dmg
          test "$(readlink /Volumes/Wildlinge/Applications)" = /Applications
          codesign --verify --deep --strict /Volumes/Wildlinge/Wildlinge.app
          node scripts/electron-smoke.mjs /Volumes/Wildlinge/Wildlinge.app/Contents/MacOS/wildlinge
