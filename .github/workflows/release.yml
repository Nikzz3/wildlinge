# Every push to master: CI checks (ci.yml) → package for all platforms → publish GitHub release.
# The download website is deployed by Railway from the same push (.railway/railway.ts), after these checks pass.
#
# Versions are semver: package.json holds MAJOR.MINOR (bump by hand), every push releases the next
# PATCH as tag v<version> (scripts/version.mjs). The version is baked into the game (title screen).
# The website links to releases/latest/download/<asset>, so asset names must stay stable.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # The commit's release version: its existing tag (re-runs) or one patch above the latest release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: version
        env: { GH_TOKEN: "${{ github.token }}" }
        run: echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"

  package:
    needs: [check, version]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: win32, arch: x64, asset: Wildlinge-windows-x64.zip }
          - { os: ubuntu-latest, platform: linux, arch: x64, asset: Wildlinge-linux-x64.AppImage }
          # macOS builds run on a Mac: ad-hoc signing (otherwise "app is damaged") and hdiutil need one.
          - { os: macos-latest, platform: darwin, arch: arm64, asset: Wildlinge-macos-arm64.dmg }
          - { os: macos-latest, platform: darwin, arch: x64, asset: Wildlinge-macos-x64.dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: 1 }
      - run: npm run package -- ${{ matrix.platform }} ${{ matrix.arch }}
        env: { WILDLINGE_VERSION: "${{ needs.version.outputs.version }}" }
      - name: Archive
        shell: bash
        working-directory: release
        run: |
          dir="Wildlinge-${{ matrix.platform }}-${{ matrix.arch }}"
          case "${{ matrix.platform }}" in
            darwin) (cd .. && node scripts/dmg.mjs "release/$dir" "${{ matrix.asset }}") ;;
            linux) (cd .. && node scripts/appimage.mjs "release/$dir" "${{ matrix.asset }}") ;;
            win32) zip -qry "../${{ matrix.asset }}" "$dir" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [package, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          notes="Build von ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # re-run of a released commit: refresh its assets
            gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Wildlinge $TAG" --notes "$notes" --latest
          fi
