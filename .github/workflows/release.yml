# Every push to master: CI checks (ci.yml) → package for all platforms → publish GitHub release.
# The download website is deployed by Railway from the same push (.railway/railway.ts), after these checks pass.
#
# Releases are tagged v<package.json version>. Bump the version for a new release; pushes without
# a bump refresh the assets of the current release (and move its tag), so "latest" is always master.
# The website links to releases/latest/download/<asset>, so asset names must stay stable.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  package:
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: win32, arch: x64, asset: Wildlinge-windows-x64.zip }
          - { os: ubuntu-latest, platform: linux, arch: x64, asset: Wildlinge-linux-x64.tar.gz }
          # macOS builds run on a Mac so the bundle can be ad-hoc signed (otherwise "app is damaged").
          - { os: macos-latest, platform: darwin, arch: arm64, asset: Wildlinge-macos-arm64.zip }
          - { os: macos-latest, platform: darwin, arch: x64, asset: Wildlinge-macos-x64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: 1 }
      - run: npm run package -- ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Archive
        shell: bash
        working-directory: release
        run: |
          dir="Wildlinge-${{ matrix.platform }}-${{ matrix.arch }}"
          case "${{ matrix.platform }}" in
            darwin)
              codesign --force --deep --sign - "$dir/Wildlinge.app"
              ditto -c -k --keepParent "$dir/Wildlinge.app" "../${{ matrix.asset }}" ;;
            linux) tar -czf "../${{ matrix.asset }}" "$dir" ;;
            win32) zip -qry "../${{ matrix.asset }}" "$dir" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          notes="Build von ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes "$notes" --latest
          else
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "Wildlinge $TAG" --notes "$notes" --latest
          fi
